[package]
name = "rshx"
version = "0.4.2"
edition = "2024"

[dependencies]
# CLI surface and argument parsing.
clap = { version = "4.6.7", features = ["derive"] }
# Colors, with per-stream tty detection and NO_COLOR support. Already in the
# tree via clap; referenced directly so rshx's own output honors the same rules.
anstream = "1.0.0"
anstyle = "1.0.14"
# `--timeout 30s` parsing. Zero dependencies of its own.
humantime = "2.4.0"
# Progress heartbeat, drawn to stderr and hidden when the terminal is not
# interactive. Handles interleaving with per-host result lines.
indicatif = "0.18.6"
# Host file parsing.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
# NDJSON output for --json.
serde_json = "1.0.151"
# Fanout scheduling: stream::iter(hosts).map(run_host).buffer_unordered(fanout).
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
# SIGTERM for the child processes: tokio's Child::kill only sends SIGKILL.
libc = "0.2.189"
# Error reporting for local failures.
anyhow = "1.0.104"

[dependencies.tokio]
version = "1.53.1"
features = [
  "macros",
  "rt-multi-thread",
  # Spawning the ssh children and reading their pipes.
  "process",
  "io-util",
  # --timeout and the SIGTERM -> SIGKILL grace period.
  "time",
  # Ctrl-C handling.
  "signal",
  # Fanout coordination between the scheduler and the reporter.
  "sync",
]
