name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells nobody anything, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes back to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Reads rust-toolchain.toml, so CI compiles with the same rustc as a
      # local checkout, and caches the build by default.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Format
        run: cargo fmt --all -- --check
      # A warning fails the build: the tree is clean today, so this pins the
      # property rather than asking for new work.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      # The suite runs against a stub ssh, so it needs no network and no sshd.
      - name: Test
        run: cargo test --locked
      - name: Build the release binary
        run: cargo build --release --locked
